name: Aetheria interface review

on:
  pull_request:
    branches: [main]
    paths:
      - 'aetheria/**'
      - 'tests/aetheria-interface.test.mjs'
      - '.github/workflows/aetheria-interface-review.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Interface contract
        run: node --test tests/aetheria-interface.test.mjs
