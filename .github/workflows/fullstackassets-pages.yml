name: Deploy Fullstackassets.com to GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fullstackassets-pages.yml'
      - 'tools/prepare_fullstackassets_pages.py'
      - 'tests/test_prepare_fullstackassets_pages.py'
      - 'CNAME'
      - 'aetheria/**'
      - 'buildgraph/**'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fullstackassets-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Pages host
        uses: actions/checkout@v4
        with:
          path: host

      - name: Checkout canonical portfolio source
        uses: actions/checkout@v4
        with:
          repository: Full-Stack-Assets/FullStackAssets
          ref: main
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test artifact builder
        run: python -m unittest discover -s host/tests -p 'test_prepare_fullstackassets_pages.py' -v

      - name: Build verified Pages artifact
        run: >-
          python host/tools/prepare_fullstackassets_pages.py
          --host host
          --source source
          --output site

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/robots.txt
          test -f site/sitemap.xml
          test -f site/aetheria/index.html
          test -f site/buildgraph/index.html
          test -f site/.nojekyll
          test "$(cat site/CNAME)" = "fullstackassets.com"
          ! grep -R -n -E '/_vercel/insights|window\.va' site --include='*.html'

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Wait for legacy Pages build for this commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pages_build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [[ "$pages_build_type" == "workflow" ]]; then
            echo "Pages already publishes exclusively through GitHub Actions."
            exit 0
          fi

          for attempt in {1..48}; do
            legacy_build="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
            legacy_commit="$(jq -r '.commit // ""' <<<"$legacy_build")"
            legacy_status="$(jq -r '.status // ""' <<<"$legacy_build")"

            if [[ "$legacy_commit" == "$GITHUB_SHA" && "$legacy_status" == "built" ]]; then
              echo "Legacy Pages build settled for $GITHUB_SHA; verified artifact will deploy last."
              exit 0
            fi

            if [[ "$legacy_commit" == "$GITHUB_SHA" && "$legacy_status" == "errored" ]]; then
              echo "Legacy Pages build failed for $GITHUB_SHA; refusing an ambiguous deployment." >&2
              exit 1
            fi

            echo "Waiting for legacy Pages build for $GITHUB_SHA (attempt $attempt/48)."
            sleep 5
          done

          echo "Timed out waiting for the legacy Pages build for $GITHUB_SHA." >&2
          exit 1

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
