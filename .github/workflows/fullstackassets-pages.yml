name: Deploy Fullstackassets.com to GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fullstackassets-pages.yml'
      - 'tools/prepare_fullstackassets_pages.py'
      - 'tests/test_prepare_fullstackassets_pages.py'
      - 'tests/buildgraph-core.test.mjs'
      - 'tests/buildgraph-data.test.mjs'
      - 'tests/buildgraph-interface.test.mjs'
      - 'CNAME'
      - 'aetheria/**'
      - 'buildgraph/**'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fullstackassets-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Pages host
        uses: actions/checkout@v4
        with:
          path: host

      - name: Checkout canonical portfolio source
        uses: actions/checkout@v4
        with:
          repository: Full-Stack-Assets/FullStackAssets
          ref: main
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test artifact builder
        run: python -m unittest discover -s host/tests -p 'test_prepare_fullstackassets_pages.py' -v

      - name: Test BuildGraph contracts
        run: >-
          node --test
          host/tests/buildgraph-core.test.mjs
          host/tests/buildgraph-data.test.mjs
          host/tests/buildgraph-interface.test.mjs

      - name: Verify canonical Library source
        run: >-
          node --test
          source/tests/*.test.mjs
          source/tests/marketplace/canon/*.test.mjs
          source/tests/marketplace/core/*.test.mjs
          source/tests/marketplace/catalog/*.test.mjs

      - name: Materialize canonical Library catalog
        run: >-
          node source/marketplace/bin/materialize-catalog.mjs
          --parts source/data/library/catalog-baseline
          --meta source/data/library/catalog-baseline.json
          --out source/data/library/catalog.snapshot.json

      - name: Inject canonical Library discovery link
        run: node source/marketplace/bin/inject-library-discovery.mjs --file source/index.html

      - name: Inject canonical Library sitemap root
        run: node source/marketplace/bin/inject-library-sitemap.mjs --file source/sitemap.xml

      - name: Build canonical Library
        run: >-
          node source/marketplace/bin/build-library.mjs
          --catalog source/data/library/catalog.snapshot.json
          --out source/library

      - name: Verify assembled canonical source
        run: >-
          node --test
          source/tests/*.test.mjs
          source/tests/marketplace/catalog/*.test.mjs

      - name: Build verified Pages artifact
        run: >-
          python host/tools/prepare_fullstackassets_pages.py
          --host host
          --source source
          --output site

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/robots.txt
          test -f site/sitemap.xml
          test -f site/library/index.html
          test -f site/library/search-index.json
          test -f site/aetheria/index.html
          test -f site/aetheria/app.js
          test -f site/aetheria/styles.css
          test -f site/buildgraph/index.html
          test -f site/buildgraph/app.js
          test -f site/buildgraph/core.mjs
          test -f site/buildgraph/styles.css
          test -f site/buildgraph/data/projects.json
          test -f site/.nojekyll
          test "$(cat site/CNAME)" = "fullstackassets.com"
          grep -q 'href="/library/"' site/index.html
          grep -q 'https://fullstackassets.com/library/' site/sitemap.xml
          ! grep -R -n -E '/_vercel/insights|window\.va' site --include='*.html'

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Wait for built-in Pages deployment for this commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pages_build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [[ "$pages_build_type" == "workflow" ]]; then
            echo "Pages already publishes exclusively through GitHub Actions."
            exit 0
          fi

          for attempt in {1..48}; do
            pages_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=dynamic&per_page=100")"
            pages_run="$(jq -c '[.workflow_runs[] | select(.name == "pages build and deployment")] | sort_by(.created_at) | last // {}' <<<"$pages_runs")"
            pages_head_sha="$(jq -r '.head_sha // ""' <<<"$pages_run")"
            pages_status="$(jq -r '.status // ""' <<<"$pages_run")"
            pages_conclusion="$(jq -r '.conclusion // ""' <<<"$pages_run")"

            if [[ "$pages_head_sha" == "$GITHUB_SHA" && "$pages_status" == "completed" && "$pages_conclusion" == "success" ]]; then
              echo "Built-in Pages deployment settled for $GITHUB_SHA; verified artifact will deploy last."
              exit 0
            fi

            if [[ "$pages_head_sha" == "$GITHUB_SHA" && "$pages_status" == "completed" && "$pages_conclusion" != "success" ]]; then
              echo "Built-in Pages deployment failed for $GITHUB_SHA; refusing an ambiguous deployment." >&2
              exit 1
            fi

            echo "Waiting for built-in Pages deployment for $GITHUB_SHA (attempt $attempt/48)."
            sleep 5
          done

          echo "Timed out waiting for the built-in Pages deployment for $GITHUB_SHA." >&2
          exit 1

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
